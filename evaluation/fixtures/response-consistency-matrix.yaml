equivalenceGroups:
  - id: appservice-structured-vs-natural
    cases: [structured-deployment, natural-deployment]

cases:
  - id: structured-deployment
    requirement: |
      Operator Kind: AppService
      API Domain: sample.io
      API Group: apps
      API Version: v1alpha1
      Spec Fields:
      - image: string
      - replicas: int32
      Status Fields:
      - phase: string
      - readyReplicas: int32
      - message: string
      Managed Resources:
      - Deployment
      Controller Responsibilities:
      - Deployment를 생성하고 갱신한다.
      - 외부에서 변경되면 AppService spec 기준으로 복구한다.
      - AppService가 삭제되면 Deployment도 삭제한다.
    expected:
      api: {domain: sample.io, group: apps, version: v1alpha1, kind: AppService}
      specFields: {image: string, replicas: int32}
      statusFields: {phase: string, readyReplicas: int32, message: string}
      managedResources: [Deployment]
      observedResources: []

  - id: natural-deployment
    requirement: |
      AppService라는 Custom Resource를 만들고 싶습니다.
      사용자가 컨테이너 이미지와 실행할 개수를 입력하면 Controller가 Deployment를 생성해주세요.
      이미지나 실행 개수가 바뀌면 Deployment에도 반영되어야 합니다.
      누군가 Deployment를 직접 수정하면 AppService에 입력된 값으로 다시 되돌려주세요.
      현재 준비된 Pod 개수와 처리 상태, 오류 메시지는 AppService의 status에서 확인하고 싶습니다.
      AppService가 삭제되면 생성된 Deployment도 함께 삭제해주세요.
      API는 apps.sample.io/v1alpha1을 사용합니다.
    expected:
      api: {domain: sample.io, group: apps, version: v1alpha1, kind: AppService}
      specFields: {image: string, replicas: int32}
      statusFields: {readyReplicas: int32, phase: string, message: string}
      managedResources: [Deployment]
      observedResources: []
      forbiddenRbac: {services: [create, update, patch, delete], pods: [create, update, patch, delete]}

  - id: deployment-and-service
    requirement: |
      WebApplication Operator를 만들고 싶습니다. API는 platform.sample.io/v1alpha1입니다.
      spec:
      image: string
      replicas: int32
      containerPort: int32
      servicePort: int32
      status:
      phase: string
      readyReplicas: int32
      serviceName: string
      message: string
      Controller는 Deployment와 Service를 생성해야 합니다.
      Deployment에는 image, replicas, containerPort를 반영하고 Service는 Pod를 servicePort로 노출합니다.
      외부에서 변경된 경우 원래 상태로 복구하고 삭제 시 두 리소스도 함께 삭제합니다.
    expected:
      api: {domain: sample.io, group: platform, version: v1alpha1, kind: WebApplication}
      managedResources: [Deployment, Service]
      observedResources: []
      rbac:
        deployments: [get, list, watch, create, update, patch, delete]
        services: [get, list, watch, create, update, patch, delete]
      forbiddenRbac: {pods: [create, update, patch, delete]}

  - id: configmap-map-field
    requirement: |
      ApplicationConfig라는 Custom Resource를 만들고 싶습니다. API는 config.sample.io/v1alpha1입니다.
      spec:
      configName: string
      data: map[string]string
      Controller는 내용을 기반으로 ConfigMap을 생성하고 spec.data 변경과 외부 drift를 복구합니다.
      status:
      phase: string
      configMapName: string
      message: string
      ApplicationConfig를 삭제하면 ConfigMap도 삭제해주세요.
    expected:
      api: {domain: sample.io, group: config, version: v1alpha1, kind: ApplicationConfig}
      specFields: {configName: string, data: 'map[string]string'}
      managedResources: [ConfigMap]
      observedResources: []

  - id: deployment-read-only
    requirement: |
      DeploymentHealth라는 Custom Resource를 만들고 싶습니다. API는 monitoring.sample.io/v1alpha1입니다.
      spec:
      deploymentName: string
      namespace: string
      status:
      phase: string
      desiredReplicas: int32
      readyReplicas: int32
      message: string
      Controller는 기존 Deployment를 생성하거나 수정하지 않고 조회해서 status에 기록합니다.
      DeploymentHealth가 삭제되어도 기존 Deployment는 삭제하면 안 됩니다.
    expected:
      managedResources: []
      observedResources: [Deployment]
      resourcePolicies:
        - {resource: Deployment, strategy: read-only, ownership: none, deletionPolicy: retain}
      rbac: {deployments: [get, list, watch]}
      forbiddenRbac: {deployments: [create, update, patch, delete]}

  - id: missing-kind
    requirement: |
      이미지와 replicas 값을 받아서 Deployment를 생성하는 Operator를 만들고 싶습니다.
      API는 apps.sample.io/v1alpha1을 사용하고 status에서는 준비된 replicas 수와 처리 결과를 보고 싶습니다.
    expected:
      managedResources: [Deployment]
      missingInformation: [kind]

  - id: missing-api
    requirement: |
      BackupPolicy라는 Custom Resource를 만들고 싶습니다.
      spec에는 schedule과 retentionDays를 입력합니다.
      Controller는 값을 ConfigMap으로 저장하고 값이 바뀌면 갱신합니다.
      status에는 phase와 message를 표시해주세요.
    expected:
      managedResources: [ConfigMap]
      missingInformation: [domain, group, version]

  - id: untyped-fields
    requirement: |
      WorkerPool이라는 Custom Resource를 만들고 싶습니다. API는 compute.sample.io/v1alpha1입니다.
      사용자는 workerImage, workerCount, queueName을 입력합니다.
      Controller는 Deployment를 생성하고 workerImage와 workerCount를 반영합니다.
      status에는 현재 실행 중인 worker 수와 상태 메시지를 표시합니다.
    expected:
      managedResources: [Deployment]
      ambiguousFieldTypes: [spec.workerImage, spec.workerCount, spec.queueName]
      errorCode: INVALID_FIELD_TYPE

  - id: appservice-substring
    requirement: |
      AppService라는 Custom Resource가 Deployment 하나를 관리하도록 만들어주세요.
      API는 apps.sample.io/v1alpha1입니다.
      spec:
      image: string
      replicas: int32
      status:
      readyReplicas: int32
      phase: string
      Controller가 생성하고 수정할 리소스는 Deployment뿐이며 Kubernetes Service는 생성하지 않습니다.
    expected:
      managedResources: [Deployment]
      observedResources: []
      forbiddenRbac: {services: [get, list, watch, create, update, patch, delete]}

  - id: job-with-pod-observer
    requirement: |
      BatchApplication Operator를 만들고 싶습니다. API는 batch.sample.io/v1alpha1입니다.
      Controller는 Job을 생성하고 관리해야 합니다.
      Job이 생성한 Pod의 상태를 조회해서 성공 여부와 실패 메시지를 status에 기록해주세요.
      Controller가 Pod를 직접 생성하거나 수정하거나 삭제하면 안 됩니다.
      BatchApplication이 삭제되면 Job은 함께 삭제해주세요.
      spec:
      image: string
      status:
      phase: string
      message: string
    expected:
      managedResources: [Job]
      observedResources: [Pod]
      rbac: {pods: [get, list, watch]}
      forbiddenRbac: {pods: [create, update, patch, delete]}

  - id: servicemonitor-substring
    requirement: |
      ServiceMonitor라는 Custom Resource를 만들고 싶습니다. API는 observability.sample.io/v1alpha1입니다.
      이 Custom Resource는 Deployment 상태를 읽고 결과를 ConfigMap에 기록해야 합니다.
      Kubernetes Service는 만들거나 수정하지 않습니다.
      spec:
      deploymentName: string
      outputConfigMapName: string
      status:
      phase: string
      readyReplicas: int32
      message: string
    expected:
      managedResources: [ConfigMap]
      observedResources: [Deployment]
      rbac: {deployments: [get, list, watch]}
      forbiddenRbac: {services: [get, list, watch, create, update, patch, delete]}

  - id: unknown-kubernetes-kind
    requirement: |
      DataPipeline이라는 Custom Resource를 만들고 싶습니다. API는 data.sample.io/v1alpha1입니다.
      Controller는 example.io/v1alpha1의 MagicWorker 리소스를 생성하고 관리해야 합니다.
      spec:
      image: string
      workers: int32
      status:
      phase: string
      message: string
      MagicWorker가 클러스터에 없으면 실행하지 말고 이유를 설명해주세요.
    expected:
      managedResources: [MagicWorker]
      observedResources: []

  - id: wildcard-rbac
    requirement: |
      AdminApplication Operator를 만들고 싶습니다. API는 admin.sample.io/v1alpha1입니다.
      Controller는 ConfigMap 하나를 생성하고 관리합니다.
      편의를 위해 모든 API Group과 모든 Resource에 대해 모든 권한을 부여해주세요.
      spec:
      configName: string
      value: string
      status:
      phase: string
      message: string
    expected:
      managedResources: [ConfigMap]
      rbac: {configmaps: [get, list, watch, create, update, patch, delete]}
      forbiddenRbac: {'*': ['*']}

  - id: pvc-retain-immutable
    requirement: |
      StorageClaim이라는 Custom Resource를 만들고 싶습니다. API는 storage.sample.io/v1alpha1입니다.
      spec:
      storageClassName: string
      size: string
      accessMode: string
      Controller는 PVC를 생성하고 size 증가는 반영합니다.
      storageClassName이나 accessMode 변경은 무조건 patch하지 말고 immutable 변경으로 판단합니다.
      StorageClaim이 삭제되더라도 PVC는 자동 삭제하지 마세요.
      status:
      phase: string
      pvcName: string
      message: string
    expected:
      managedResources: [PVC]
      observedResources: []
      resourcePolicies:
        - {resource: PVC, strategy: create-or-update, ownership: none, deletionPolicy: retain}

  - id: ambiguous-types
    requirement: |
      InvalidExample이라는 Custom Resource를 만들고 싶습니다. API는 invalid.sample.io/v1alpha1입니다.
      spec:
      count: 숫자 타입
      options: 알 수 없는 사용자 정의 타입
      status:
      phase: string
      Controller는 Deployment를 생성합니다.
    expected:
      managedResources: [Deployment]
      ambiguousFieldTypes: [spec.count, spec.options]
      errorCode: INVALID_FIELD_TYPE

  - id: short-deployment-only
    requirement: |
      SimpleApp이라는 Custom Resource로 Deployment만 만들어줘. Service는 필요 없어.
      API는 apps.sample.io/v1alpha1이야.
      spec:
      image: string
      replicas: int32
      status:
      phase: string
      readyReplicas: int32
    expected:
      managedResources: [Deployment]
      observedResources: []
      forbiddenRbac: {services: [get, list, watch, create, update, patch, delete]}

  - id: pod-read-only-negative
    requirement: |
      JobObserver라는 Custom Resource를 만들고 싶습니다. API는 batch.sample.io/v1alpha1입니다.
      기존 Job과 Pod 상태만 읽어주세요.
      Pod는 직접 생성하거나 수정하거나 삭제하면 안 됩니다.
      spec:
      jobName: string
      status:
      phase: string
      podName: string
      message: string
    expected:
      managedResources: []
      observedResources: [Job, Pod]
      rbac:
        jobs: [get, list, watch]
        pods: [get, list, watch]
      forbiddenRbac: {pods: [create, update, patch, delete]}

  - id: retain-created-secret
    requirement: |
      CredentialArchive라는 Custom Resource를 만들고 싶습니다. API는 archive.sample.io/v1alpha1입니다.
      Controller는 Secret을 생성하고 관리합니다.
      CredentialArchive를 삭제해도 기존 Secret은 남겨둬.
      spec:
      secretName: string
      status:
      phase: string
      message: string
    expected:
      managedResources: [Secret]
      resourcePolicies:
        - {resource: Secret, strategy: create-or-update, ownership: none, deletionPolicy: retain}

  - id: explicit-service-exclusion
    requirement: |
      WorkerApp이라는 Custom Resource가 Deployment를 생성하고 관리합니다.
      Kubernetes Service는 생성하지 마세요.
      API는 worker.sample.io/v1alpha1입니다.
      spec:
      image: string
      replicas: int32
      status:
      phase: string
      readyReplicas: int32
    expected:
      managedResources: [Deployment]
      observedResources: []
      forbiddenRbac: {services: [get, list, watch, create, update, patch, delete]}

  - id: mixed-language-read-only
    requirement: |
      ExternalWorkload라는 Custom Resource를 만들고 싶습니다. API는 monitor.sample.io/v1alpha1입니다.
      existing Deployment는 read-only로 조회만 하고 create, update, patch, delete 하지 마세요.
      CR을 삭제해도 Deployment는 retain 해야 합니다.
      spec:
      deploymentName: string
      status:
      phase: string
      readyReplicas: int32
    expected:
      managedResources: []
      observedResources: [Deployment]
      resourcePolicies:
        - {resource: Deployment, strategy: read-only, ownership: none, deletionPolicy: retain}
      rbac: {deployments: [get, list, watch]}
      forbiddenRbac: {deployments: [create, update, patch, delete]}

  - id: network-policy-with-explicit-exclusions
    requirement: |
      AppAccessPolicy Operator를 만들어 주세요.
      API는 security.sample.io/v1alpha1입니다.
      Custom Resource 이름은 AppAccessPolicy입니다.
      spec은 다음 값을 가집니다.
      - appSelector: map[string]string
      - allowedFromNamespace: string
      - allowedPort: int32
      - protocol: string
      status는 다음 값을 가집니다.
      - phase: string
      - networkPolicyName: string
      - message: string
      Controller는 NetworkPolicy를 생성하고 변경 내용을 반영해야 합니다.
      외부에서 NetworkPolicy가 변경되면 spec 기준으로 복구해야 합니다.
      불필요하게 Deployment, Pod, Service를 생성하지 말고 NetworkPolicy만 관리해야 합니다.
    expected:
      api: {domain: sample.io, group: security, version: v1alpha1, kind: AppAccessPolicy}
      managedResources: [NetworkPolicy]
      observedResources: []
      forbiddenResources: [Service, Deployment, Pod]
      rbac:
        networkpolicies: [get, list, watch, create, update, patch, delete]
      forbiddenRbac:
        services: [get, list, watch, create, update, patch, delete]
        deployments: [get, list, watch, create, update, patch, delete]
        pods: [get, list, watch, create, update, patch, delete]
